[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "main.py",
    "config/*.py",
    "api/deepseek.py",
    "api/http.py",
    "api/deepseek_pricing.py",
    "api/providers/base.py",
    "api/providers/deepseek.py",
    "core/identity.py",
    "core/pet_characters.py",
    "data/directory.py",
    "scripts/build_vpet_character.py",
    "scripts/build_vpet_rigged_pet.py",
    "updater/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "main.py",
    "config/*.py",
    "api/deepseek.py",
    "api/http.py",
    "api/deepseek_pricing.py",
    "api/providers/base.py",
    "api/providers/__init__.py",
    "api/providers/api_balance.py",
    "api/providers/claude.py",
    "api/providers/copilot.py",
    "api/providers/zai.py",
    "api/providers/quota_api.py",
    "api/providers/kimi.py",
    "api/providers/minimax.py",
    "api/providers/elevenlabs.py",
    "api/providers/gemini.py",
    "scripts/claude_statusline.py",
    "ui/provider_translations.py",
    "ui/provider_branding.py",
    "ui/provider_picker.py",
    "ui/quota_details.py",
    "api/providers/deepseek.py",
    "core/identity.py",
    "data/directory.py",
    "updater/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM"]

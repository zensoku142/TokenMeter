name: pet-release

on:
  push:
    tags:
      - "pet-v*"
  workflow_dispatch:
    inputs:
      replace_existing:
        description: "替换当前版本的已发布桌宠 Release（更新标签和附件）"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tokenmeter-pet-release
  cancel-in-progress: false

jobs:
  build-pet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Validate pet tag and release notes
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -LiteralPath "pet_host/extension.json" -Raw | ConvertFrom-Json
          $tag = "pet-v$($manifest.version)"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ inputs.replace_existing }}" -ne "true") { throw "Confirm replacement of the existing pet release" }
            if ($env:GITHUB_REF_TYPE -ne "branch") { throw "Select a branch for the pet rebuild" }
            $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
            if ($LASTEXITCODE -ne 0 -or $draft -ne "false") { throw "Published pet release $tag not found" }
            $previous = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha
            if ($LASTEXITCODE -ne 0 -or -not $previous) { throw "Cannot read existing pet tag $tag" }
            "previous_tag=$previous" >> $env:GITHUB_OUTPUT
          } elseif ($env:GITHUB_REF_NAME -cne $tag) {
            throw "Pet tag must match pet_host/extension.json"
          }
          $notes = Join-Path "release-notes" "$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Pet release notes are required" }
          $body = Get-Content -LiteralPath $notes -Raw
          if ($body -notmatch "更新类型" -or $body -notmatch "验证") {
            throw "Pet release notes must include change type and verification"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($manifest.version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install build-time FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Test pet packaging and update lifecycle
        run: python -m pytest tests/test_pet_extension.py tests/test_packaging.py tests/test_update.py -q

      - name: Build independent pet extension
        run: python scripts/build_release.py --stage pet

      - name: Verify pet release files
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "pet_host/extension.json" -Raw | ConvertFrom-Json).version
          $required = @("extension.json", "TokenMeter-Pet-v$version-x64.zip", "TokenMeter-Pet-Host-v$version-x64.zip",
            "TokenMeter-Pet-vup-v$version-x64.zip", "TokenMeter-Pet-whale-v$version-x64.zip",
            "TokenMeter-Pet-bailong-v$version-x64.zip")
          $seen = @{}
          foreach ($line in Get-Content -LiteralPath "dist-pet/SHA256SUMS.txt") {
            if ($line -cnotmatch '^([0-9a-f]{64}) \*(.+)$') { throw "Invalid pet checksum entry" }
            $hash = $Matches[1]
            $name = $Matches[2]
            if ($name -cnotin $required -or $seen.ContainsKey($name)) { throw "Unexpected pet checksum entry: $name" }
            if ((Get-FileHash -LiteralPath (Join-Path "dist-pet" $name) -Algorithm SHA256).Hash -cne $hash.ToUpperInvariant()) {
              throw "Pet checksum mismatch: $name"
            }
            $seen[$name] = $true
          }
          if ($seen.Count -ne $required.Count) { throw "Missing pet release files" }

      - name: Move existing pet tag after validation
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous_tag }}
        run: |
          # 只有构建完成且分支、旧标签均未变化时才替换，避免覆盖并发发布。
          $branch = [Uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $head = gh api "repos/$env:GITHUB_REPOSITORY/commits/$branch" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw "Selected branch changed during the pet build" }
          $current = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --jq .object.sha
          if ($LASTEXITCODE -ne 0 -or $current -ne $env:PREVIOUS_TAG) { throw "Pet release tag changed during the build" }
          $tagObject = gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/tags" `
            -f "tag=$env:RELEASE_TAG" -f "message=Release $env:RELEASE_TAG rebuild" `
            -f "object=$env:GITHUB_SHA" -f "type=commit" `
            -f "tagger[name]=github-actions[bot]" `
            -f "tagger[email]=41898282+github-actions[bot]@users.noreply.github.com" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not $tagObject) { throw "Cannot create rebuilt pet tag" }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG" `
            -f "sha=$tagObject" -F force=true
          if ($LASTEXITCODE -ne 0) { throw "Cannot update pet tag" }

      # 扩展不占用主程序的 latest，也不构建或上传面板安装器。
      - name: Publish pet release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: TokenMeter Pet ${{ steps.metadata.outputs.tag }}
          draft: false
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          make_latest: false
          body_path: release-notes/${{ steps.metadata.outputs.tag }}.md
          fail_on_unmatched_files: true
          files: |
            dist-pet/TokenMeter-Pet-v*-x64.zip
            dist-pet/TokenMeter-Pet-Host-v*-x64.zip
            dist-pet/TokenMeter-Pet-vup-v*-x64.zip
            dist-pet/TokenMeter-Pet-whale-v*-x64.zip
            dist-pet/TokenMeter-Pet-bailong-v*-x64.zip
            dist-pet/extension.json
            dist-pet/SHA256SUMS.txt

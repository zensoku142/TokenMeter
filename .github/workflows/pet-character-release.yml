name: pet-character-release

on:
  push:
    tags:
      - "pet-character-*-v*"

permissions:
  contents: write

jobs:
  build-character:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve and validate character metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^pet-character-(?<id>[a-z0-9][a-z0-9._-]*)-v(?<version>[0-9][0-9A-Za-z.-]*)$') {
            throw "Invalid character tag"
          }
          $manifestPath = "pet_host/characters/$($Matches.id)/character.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "Unknown character id" }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.id -cne $Matches.id -or $manifest.version -cne $Matches.version) {
            throw "Character tag must match character.json"
          }
          $notes = "release-notes/$($env:RELEASE_TAG).md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Character release notes are required" }
          $body = Get-Content -LiteralPath $notes -Raw
          if ($body -notmatch "更新类型" -or $body -notmatch "验证") {
            throw "Character release notes must include change type and verification"
          }
          "character_id=$($Matches.id)" >> $env:GITHUB_OUTPUT
          "character_name=$($manifest.name)" >> $env:GITHUB_OUTPUT
          "character_version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test character packaging and runtime contract
        run: python -m pytest tests/test_pet_characters.py tests/test_vpet_rigged_pet.py tests/test_vpet_action_contract.py -q

      - name: Build character pack
        shell: pwsh
        run: python scripts/build_vpet_character.py "${{ steps.metadata.outputs.character_id }}" --output-dir dist-character

      - name: Publish character release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.metadata.outputs.character_name }} v${{ steps.metadata.outputs.character_version }}
          draft: false
          prerelease: false
          make_latest: false
          body_path: release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist-character/TokenMeter-Pet-Character-*-v*.zip
            dist-character/${{ steps.metadata.outputs.character_id }}.json
